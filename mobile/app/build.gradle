plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// API keys live in local.properties (git-ignored) or in environment variables - never in source.
// Copy local.properties.example and fill it in.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def secret = { String name ->
    def value = localProps.getProperty(name) ?: System.getenv(name) ?: ''
    if (value.isEmpty()) logger.warn("WARNING: ${name} is not set in local.properties - the related feature will not work.")
    return value
}

android {
    namespace 'com.cinematrack.share'
    compileSdk 34
    defaultConfig {
        applicationId "com.cinematrack.share"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0"
        buildConfigField "String", "TMDB_KEY",   "\"${secret('TMDB_KEY')}\""
        buildConfigField "String", "GEMINI_KEY", "\"${secret('GEMINI_KEY')}\""
        buildConfigField "String", "RAPID_KEY",  "\"${secret('RAPID_KEY')}\""
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
