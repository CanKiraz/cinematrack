plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// The app holds no TMDB / Gemini / RapidAPI keys: it talks to the CinemaTrack API (worker/).
// To develop against your own API, set API_URL in local.properties (git-ignored) or as an environment variable.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def apiUrl = (localProps.getProperty('API_URL') ?: System.getenv('API_URL') ?: 'https://cinematrack-api.cinematrack-api.workers.dev')
    .trim().replaceAll('/+$', '')

android {
    namespace 'com.cinematrack.share'
    compileSdk 34
    defaultConfig {
        applicationId "com.cinematrack.share"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.1.0"
        buildConfigField "String", "API_URL", "\"${apiUrl}\""
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
